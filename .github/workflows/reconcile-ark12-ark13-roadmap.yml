name: Reconcile ARK12 and ARK13 roadmap

on:
  push:
    branches:
      - tmp/reconcile-ark12-ark13-roadmap

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: tmp/reconcile-ark12-ark13-roadmap
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Reconcile roadmap evidence
        run: python scripts/reconcile_ark12_ark13_tmp.py
      - name: Download and verify agentic-repo-kit v0.1.9
        shell: bash
        run: |
          set -euo pipefail
          KIT_PATH="$RUNNER_TEMP/agentic-repo-kit-0.1.9.pyz"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "$KIT_PATH" \
            https://github.com/kaaburgh/agentic-repo-kit/releases/download/v0.1.9/agentic-repo-kit-0.1.9.pyz
          actual="$(sha256sum "$KIT_PATH" | awk '{print $1}')"
          test "$actual" = "79e914bc322873025f41db0ffa118bd037362b77708e4433bb854d8dd42b041e"
          echo "KIT_PATH=$KIT_PATH" >> "$GITHUB_ENV"
      - name: Validate reconciled repository contract
        run: python "$KIT_PATH" check .
      - name: Commit reconciled roadmap and remove temporary files
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/reconcile-ark12-ark13-roadmap.yml
          git rm scripts/reconcile_ark12_ark13_tmp.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ROADMAP.md
          git commit -m "Reconcile ARK12 and ARK13 roadmap evidence"
          git push origin HEAD:tmp/reconcile-ark12-ark13-roadmap
