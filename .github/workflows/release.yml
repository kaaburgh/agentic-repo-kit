name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve release identity
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          version="$(python - <<'PY'
          import json
          from pathlib import Path
          import tomllib

          from agentic_repo_kit import __version__

          pyproject = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          project_version = pyproject["project"]["version"]
          lock_version = json.loads(Path(".agentic-repo.lock.json").read_text(encoding="utf-8"))["tool_version"]
          if not (__version__ == project_version == lock_version):
              raise SystemExit(
                  f"version mismatch: package={__version__} pyproject={project_version} lock={lock_version}"
              )
          print(__version__)
          PY
          )"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Decide whether this push owns a version release
        id: gate
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ -z "$BEFORE_SHA" || "$BEFORE_SHA" =~ ^0+$ ]]; then
            changed="$(git show --format= --name-only "$CURRENT_SHA")"
          else
            changed="$(git diff --name-only "$BEFORE_SHA" "$CURRENT_SHA")"
          fi

          if grep -qx 'agentic_repo_kit/__init__.py' <<<"$changed" && grep -qx 'pyproject.toml' <<<"$changed"; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify release/tag state
        if: steps.gate.outputs.publish == 'true'
        id: state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.identity.outputs.tag }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            tag_sha="$(git rev-list -n 1 "$TAG")"
            if [[ "$tag_sha" != "$CURRENT_SHA" ]]; then
              echo "existing tag $TAG points to $tag_sha, expected $CURRENT_SHA" >&2
              exit 1
            fi
          fi
          echo "exists=false" >> "$GITHUB_OUTPUT"

      - name: Build deterministic source archives
        if: steps.gate.outputs.publish == 'true' && steps.state.outputs.exists == 'false'
        shell: bash
        env:
          VERSION: ${{ steps.identity.outputs.version }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p dist
          prefix="agentic-repo-kit-$VERSION/"
          git archive --format=tar --prefix="$prefix" "$CURRENT_SHA" | gzip -n > "dist/agentic-repo-kit-$VERSION.tar.gz"
          git archive --format=zip --prefix="$prefix" -o "dist/agentic-repo-kit-$VERSION.zip" "$CURRENT_SHA"
          (
            cd dist
            sha256sum "agentic-repo-kit-$VERSION.tar.gz" "agentic-repo-kit-$VERSION.zip" > SHA256SUMS
          )

      - name: Publish GitHub Release
        if: steps.gate.outputs.publish == 'true' && steps.state.outputs.exists == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.identity.outputs.tag }}
          VERSION: ${{ steps.identity.outputs.version }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            "dist/agentic-repo-kit-$VERSION.tar.gz" \
            "dist/agentic-repo-kit-$VERSION.zip" \
            "dist/SHA256SUMS" \
            --target "$CURRENT_SHA" \
            --title "agentic-repo-kit $VERSION" \
            --generate-notes
