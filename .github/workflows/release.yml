name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: agentic-repo-kit-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve release identity
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          version="$(python - <<'PY'
          import json
          from pathlib import Path
          import re
          import tomllib

          from agentic_repo_kit import __version__
          from agentic_repo_kit.distribution import artifact_name, release_tag

          pyproject = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          project_version = pyproject["project"]["version"]
          lock = json.loads(Path(".agentic-repo.lock.json").read_text(encoding="utf-8"))
          lock_version = lock["tool_version"]
          if not (__version__ == project_version == lock_version):
              raise SystemExit(
                  f"version mismatch: package={__version__} pyproject={project_version} lock={lock_version}"
              )
          if lock.get("format") != 2:
              raise SystemExit(f"release-owning lock must use format 2, got {lock.get('format')!r}")
          distribution = lock.get("distribution")
          expected = {
              "repository": "kaaburgh/agentic-repo-kit",
              "release": release_tag(),
              "artifact": artifact_name(),
              "tool_version": __version__,
          }
          if not isinstance(distribution, dict):
              raise SystemExit("missing lock distribution identity")
          for key, value in expected.items():
              if distribution.get(key) != value:
                  raise SystemExit(
                      f"distribution mismatch for {key}: expected {value!r}, got {distribution.get(key)!r}"
                  )
          digest = distribution.get("sha256")
          if not isinstance(digest, str) or re.fullmatch(r"[0-9a-f]{64}", digest) is None:
              raise SystemExit("invalid lock distribution sha256")
          print(__version__)
          PY
          )"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Decide whether this push owns a version release
        id: gate
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ -z "$BEFORE_SHA" || "$BEFORE_SHA" =~ ^0+$ ]]; then
            changed="$(git show --format= --name-only "$CURRENT_SHA")"
          else
            changed="$(git diff --name-only "$BEFORE_SHA" "$CURRENT_SHA")"
          fi

          if grep -qx 'agentic_repo_kit/__init__.py' <<<"$changed" && grep -qx 'pyproject.toml' <<<"$changed"; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify release/tag state
        if: steps.gate.outputs.publish == 'true'
        id: state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.identity.outputs.tag }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          release_exists=false
          if gh release view "$TAG" >/dev/null 2>&1; then
            release_exists=true
          fi

          tag_exists=false
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            tag_exists=true
            tag_sha="$(git rev-list -n 1 "$TAG")"
            if [[ "$tag_sha" != "$CURRENT_SHA" ]]; then
              echo "existing tag $TAG points to $tag_sha, expected $CURRENT_SHA" >&2
              exit 1
            fi
          fi

          if [[ "$release_exists" == true && "$tag_exists" != true ]]; then
            echo "release $TAG exists but the corresponding tag was not fetched/found" >&2
            exit 1
          fi

          assets_complete=false
          if [[ "$release_exists" == true ]]; then
            asset_names="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
            version='${{ steps.identity.outputs.version }}'
            if grep -qx "agentic-repo-kit-$version.pyz" <<<"$asset_names" \
              && grep -qx "agentic-repo-kit-$version.tar.gz" <<<"$asset_names" \
              && grep -qx "agentic-repo-kit-$version.zip" <<<"$asset_names" \
              && grep -qx 'SHA256SUMS' <<<"$asset_names"; then
              assets_complete=true
            fi
          fi

          echo "release_exists=$release_exists" >> "$GITHUB_OUTPUT"
          echo "assets_complete=$assets_complete" >> "$GITHUB_OUTPUT"

      - name: Build and verify deterministic release artifacts
        if: steps.gate.outputs.publish == 'true' && steps.state.outputs.assets_complete != 'true'
        shell: bash
        env:
          VERSION: ${{ steps.identity.outputs.version }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p dist
          pyz="dist/agentic-repo-kit-$VERSION.pyz"
          actual_pyz_sha="$(python scripts/build_pyz.py --output "$pyz")"
          expected_pyz_sha="$(python - <<'PY'
          import json
          from pathlib import Path
          print(json.loads(Path(".agentic-repo.lock.json").read_text(encoding="utf-8"))["distribution"]["sha256"])
          PY
          )"
          if [[ "$actual_pyz_sha" != "$expected_pyz_sha" ]]; then
            echo "executable artifact digest mismatch: built=$actual_pyz_sha lock=$expected_pyz_sha" >&2
            exit 1
          fi

          prefix="agentic-repo-kit-$VERSION/"
          git archive --format=tar --prefix="$prefix" "$CURRENT_SHA" | gzip -n > "dist/agentic-repo-kit-$VERSION.tar.gz"
          git archive --format=zip --prefix="$prefix" -o "dist/agentic-repo-kit-$VERSION.zip" "$CURRENT_SHA"
          (
            cd dist
            sha256sum \
              "agentic-repo-kit-$VERSION.pyz" \
              "agentic-repo-kit-$VERSION.tar.gz" \
              "agentic-repo-kit-$VERSION.zip" \
              > SHA256SUMS
          )

      - name: Create GitHub Release
        if: steps.gate.outputs.publish == 'true' && steps.state.outputs.release_exists == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.identity.outputs.tag }}
          VERSION: ${{ steps.identity.outputs.version }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            "dist/agentic-repo-kit-$VERSION.pyz" \
            "dist/agentic-repo-kit-$VERSION.tar.gz" \
            "dist/agentic-repo-kit-$VERSION.zip" \
            "dist/SHA256SUMS" \
            --target "$CURRENT_SHA" \
            --title "agentic-repo-kit $VERSION" \
            --generate-notes

      - name: Repair missing release assets
        if: steps.gate.outputs.publish == 'true' && steps.state.outputs.release_exists == 'true' && steps.state.outputs.assets_complete != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.identity.outputs.tag }}
          VERSION: ${{ steps.identity.outputs.version }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" \
            "dist/agentic-repo-kit-$VERSION.pyz" \
            "dist/agentic-repo-kit-$VERSION.tar.gz" \
            "dist/agentic-repo-kit-$VERSION.zip" \
            "dist/SHA256SUMS" \
            --clobber
