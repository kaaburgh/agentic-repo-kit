[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-repo-kit"
version = "0.1.8"
description = "Versioned repository policy compiler for agent-driven engineering repositories"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "kaaburgh"}]
dependencies = []

[project.scripts]
agentic-repo = "agentic_repo_kit.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
agentic_repo_kit = [
  "distribution.json",
  "templates/*.tmpl",
  "profiles/*/*.md",
  "skills/*.md",
]

[tool.setuptools.packages.find]
include = ["agentic_repo_kit"]
namespaces = false
